allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  puppeteer: true
  sharp: true

minimumReleaseAgeExclude:
  - shell-quote@1.8.4
  - esbuild@0.28.1
  - vite@8.0.16
  - '@babel/core@7.29.1'
  - js-yaml@3.15.0 || 4.1.2
  - ws@7.5.11 || 8.21.0
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0

overrides:
  fast-uri@<=3.1.7: '3.1.8'
  smol-toml@<1.9.0: '>=1.9.0'
  source-map-js@<1.2.2: '>=1.2.2'
  sharp@<0.35.5: '>=0.35.5'
  shell-quote@>=1.8.4 <1.11.0: '>=1.11.0'
  file-type@>=13.0.0 <21.3.1: '>=21.3.1'
  basic-ftp@<=5.3.0: '>=5.3.1'
  ip-address@<=10.1.0: '>=10.1.1'
  postcss@<8.5.10: '>=8.5.10'
  webpack@<5.104.1: '>=5.104.1'
  # @axe-core/playwright takes playwright-core as a `>= 1.0.0` peer, so any
  # stray copy in the graph can satisfy it. A second copy makes its `Page`
  # structurally incompatible with @playwright/test's, which only surfaces as a
  # type error, so keep the peer pinned to the version we test with.
  '@axe-core/playwright>playwright-core': '$@playwright/test'
