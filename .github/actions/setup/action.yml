name: Set up toolchain
description: Install the tools pinned in mise.toml, then install dependencies.

runs:
  using: composite
  steps:
    # --locked installs from the URLs and checksums in mise.lock.
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.7
        install_args: --locked

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    # postinstall also generates the i18n types. Only print-cv needs
    # puppeteer's Chrome, and CI never runs it.
    - name: Install dependencies
      shell: bash
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"
      run: pnpm install --frozen-lockfile
