name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Secret scan
        run: gitleaks git --no-banner --redact --verbose --log-opts=HEAD

      # Audits dev dependencies too; `--prod` hid every advisory the build
      # tooling carries. Record an unfixable one with `pnpm audit --ignore`.
      - name: Dependency audit
        run: pnpm audit

      - name: Annotate Biome diagnostics
        continue-on-error: true
        run: pnpm lint:biome --reporter=github

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm spellcheck
      - run: pnpm test:coverage

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # A placeholder GA id, so the browser suites see the consent banner.
      - run: pnpm build:e2e

      # The a11y, visual and Lighthouse jobs all test this exact artifact
      # rather than rebuilding or running a dev server.
      - name: Upload static export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-export
          path: dist/client
          retention-days: 1

  a11y:
    name: Accessibility
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-export
          path: dist/client

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run a11y tests
        run: pnpm test:a11y

      - name: Run preference persistence tests
        run: pnpm test:preferences

      - name: Upload a11y report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: tests/e2e/.playwright/
          # Without this, the upload skips the directory because its name starts with a dot.
          include-hidden-files: true
          retention-days: 7

  visual:
    name: Visual regression
    needs: build
    # Baselines are rendered on arm64; see bin/visual-docker.sh.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-export
          path: dist/client

      # Chromium runs in the Playwright Docker image, not on the runner.
      - name: Run visual tests
        run: pnpm test:visual

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: tests/e2e/.playwright/
          # Without this, the upload skips the directory because its name starts with a dot.
          include-hidden-files: true
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-export
          path: dist/client

      # The action bundles its own lhci, so @lhci/cli is not a dependency here.
      # It was the only source of the extract-zip advisory (no patch has ever
      # been published) and of every deprecated transitive package.
      # `staticDistDir: out` in the config makes lhci serve the export itself.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          artifactName: lighthouse-report
