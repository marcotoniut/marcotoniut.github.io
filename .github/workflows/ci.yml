name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      # Audits dev dependencies too; `--prod` hid every advisory the build
      # tooling carries. Record an unfixable one with `pnpm audit --ignore`.
      - name: Dependency audit
        run: pnpm audit

      - name: Annotate Biome diagnostics
        continue-on-error: true
        run: pnpm lint:biome --reporter=github

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm spellcheck
      - run: pnpm test

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      - run: pnpm build

      # The a11y, visual and Lighthouse jobs all test this exact artifact
      # rather than rebuilding or running a dev server.
      - name: Upload static export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-export
          path: dist/client
          retention-days: 1

  a11y:
    name: Accessibility
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      - name: Download static export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-export
          path: dist/client

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run a11y tests
        run: pnpm test:a11y

      - name: Run preference persistence tests
        run: pnpm test:preferences

      - name: Upload a11y report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-report
          path: tests/e2e/.playwright/
          retention-days: 7

  visual:
    name: Visual regression
    needs: build
    # Baselines are rendered on arm64; see bin/visual-docker.sh.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      - name: Download static export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-export
          path: dist/client

      # Chromium runs in the Playwright Docker image, not on the runner.
      - name: Run visual tests
        run: pnpm test:visual

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-report
          path: tests/e2e/.playwright/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download static export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-export
          path: dist/client

      # The action bundles its own lhci, so @lhci/cli is not a dependency here.
      # It was the only source of the extract-zip advisory (no patch has ever
      # been published) and of every deprecated transitive package.
      # `staticDistDir: out` in the config makes lhci serve the export itself.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          artifactName: lighthouse-report
