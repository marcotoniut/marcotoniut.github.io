# yaml-language-server: $schema=https://lefthook.dev/schema.json
pre-commit:
  parallel: true
  commands:
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: if command -v actionlint >/dev/null 2>&1; then actionlint {staged_files}; else echo "actionlint not installed — run 'proto install' to enable" >&2; exit 1; fi
    sitemap:
      run: pnpm generate:sitemap && git add public/sitemap.xml
      stage_fixed: true
    generate:
      run: pnpm generate
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    spellcheck:
      run: pnpm spellcheck

pre-push:
  commands:
    tests:
      run: ./bin/pre-push.sh
