# yaml-language-server: $schema=https://lefthook.dev/schema.json
pre-commit:
  jobs:
    # Before the group: sitemap, lint and typecheck read the generated types.
    - name: generate
      glob:
        - "src/i18n/**"
        - ".typesafe-i18n.json"
      run: pnpm generate

    - group:
        parallel: true
        jobs:
          - name: actionlint
            glob: ".github/workflows/*.{yml,yaml}"
            run: if command -v actionlint >/dev/null 2>&1; then actionlint {staged_files}; else echo "actionlint not installed; run 'mise install' to enable" >&2; exit 1; fi
          - name: sitemap
            run: pnpm generate:sitemap && git add public/sitemap.xml
            stage_fixed: true
          - name: lint
            run: pnpm lint
          - name: typecheck
            run: pnpm typecheck
          - name: spellcheck
            run: pnpm spellcheck
          - name: secret-scan
            run: if command -v gitleaks >/dev/null 2>&1; then gitleaks git --staged --no-banner --verbose --redact; else echo "gitleaks not installed; run 'mise install' to enable" >&2; exit 1; fi

commit-msg:
  commands:
    conventional-commit:
      run: bash bin/commit-msg.sh {1}

pre-push:
  commands:
    tests:
      run: ./bin/pre-push.sh
